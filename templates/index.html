<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumiko Generator</title>
    <style>
        :root { --primary: #00adb5; --bg-dark: #121212; --bg-panel: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        
        .main-wrapper { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; min-height: 90vh; }
        
        /* Colonnes */
        .settings-column { flex: 1; background: var(--bg-panel); padding: 25px; border-radius: 12px; display: flex; flex-direction: column; }
        .preview-column { flex: 2; background: var(--bg-panel); padding: 25px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        /* Multilingue */
        .lang-selector-container { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 15px; }
        .lang-selector-container select { width: auto; padding: 5px; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 4px; }

        /* Formulaire */
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #ccc; font-size: 13px; }
        input[type="number"], select { width: 100%; padding: 8px 10px; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input[type="color"] { width: 100%; height: 38px; padding: 2px; background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; box-sizing: border-box; }
        
        /* Checkbox style */
        .checkbox-container { display: flex; align-items: center; background: #252525; padding: 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; margin-bottom: 15px; }
        .checkbox-container input { width: auto; margin: 0 10px 0 0; cursor: pointer; transform: scale(1.2); }
        .checkbox-container span { color: #fff; font-size: 14px; font-weight: 600; }

        /* Drag & Drop */
        .drop-zone { height: 100px; display: flex; align-items: center; justify-content: center; border: 2px dashed #555; background: #222; border-radius: 8px; cursor: pointer; margin-bottom: 20px; text-align: center; transition: all 0.2s; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: rgba(0, 173, 181, 0.05); }
        .drop-zone input[type="file"] { display: none; }
        .drop-zone-text { color: var(--primary); font-weight: bold; font-size: 15px; pointer-events: none; }

        /* Boutons */
        .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: auto; transition: background 0.2s; }
        .btn-submit:hover { background: #008f96; }
        .btn-download { display: none; margin-top: 20px; background: #4caf50; padding: 12px 25px; border-radius: 6px; color: white; text-decoration: none; font-weight: bold; }
        .btn-download:hover { background: #43a047; }

        /* Prévisualisation & Spinner */
        #svg-preview { max-width: 100%; max-height: 75vh; border-radius: 8px; display: none; background: white; padding: 10px; }
        .placeholder-text { color: #666; font-style: italic; text-align: center; }
        #loading-overlay { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(30, 30, 30, 0.9); border-radius: 12px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="settings-column">
        <div class="lang-selector-container">
            <label data-i18n="lang_select" style="margin:0;">🌍 Langue :</label>
            <select id="lang-switch">
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>

        <h1 data-i18n="title" style="margin-top: 0; margin-bottom: 20px; text-align: center; font-size: 22px;">Générateur Kumiko</h1>
        
        <form id="kumiko-form" style="display: flex; flex-direction: column; flex-grow: 1;">
            <label data-i18n="select_image">📸 Sélectionner l'image :</label>
            <div class="drop-zone" id="drop-zone">
                <span class="drop-zone-text" id="drop-text">Glissez une image ici 📁</span>
                <input type="file" id="file-input" name="file" accept="image/*" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label data-i18n="width">↔️ Largeur (Colonnes) :</label>
                    <input type="number" name="grid_width" value="14" min="1">
                </div>
                <div class="form-group">
                    <label data-i18n="height">↕️ Hauteur (Lignes) :</label>
                    <input type="number" name="grid_height" value="14" min="1">
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" name="force_crop" value="true">
                <span data-i18n="force_crop">✂️ Forcer la grille (Recadre l'image)</span>
            </label>

            <div class="form-row">
                <div class="form-group">
                    <label data-i18n="bg_color">⬛ Fond :</label>
                    <input type="color" name="background_color" value="#000000">
                </div>
                <div class="form-group">
                    <label data-i18n="border_color">🟫 Bordure :</label>
                    <input type="color" name="triangle_border_color" value="#683e07">
                </div>
            </div>

            <div class="form-group">
                <label data-i18n="orientation">📐 Orientation :</label>
                <select name="orientation">
                    <option value="pointy" data-i18n="pointy">Pointy (Pointes en haut)</option>
                    <option value="flat" data-i18n="flat">Flat (Plat en haut)</option>
                </select>
            </div>

            <div class="form-group">
                <label><span data-i18n="colors">🎨 Couleurs dominantes :</span></label>
                <input type="number" name="colors" value="5" min="2" max="10">
            </div>

            <div class="form-group">
                <label data-i18n="exclude_bg">✂️ Transparence du fond :</label>
                <select name="exclude_background">
                    <option value="no" data-i18n="exclude_no">Non (Générer motifs pour fond)</option>
                    <option value="yes" data-i18n="exclude_yes">Oui (Ignorer le fond)</option>
                </select>
            </div>
            
            <button type="submit" class="btn-submit" data-i18n="generate_btn">⚡ Générer le Plan</button>
        </form>
    </div>

    <div class="preview-column">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <h3 data-i18n="loading" style="color: white;">Analyse et génération... ☕</h3>
        </div>
        <p class="placeholder-text" id="placeholder-text" data-i18n="placeholder">Le SVG s'affichera ici...</p>
        <img id="svg-preview" src="" alt="Aperçu SVG">
        <a id="download-btn" href="#" download class="btn-download" data-i18n="download">⬇️ Télécharger le SVG</a>
    </div>
</div>

<script>
    const translations = {
      "fr": {
        "title": "Générateur Kumiko", "lang_select": "🌍 Langue :", "select_image": "📸 Sélectionner l'image :",
        "width": "↔️ Largeur (Colonnes) :", "height": "↕️ Hauteur (Lignes) :", "force_crop": "✂️ Forcer la grille (Recadre l'image)",
        "orientation": "📐 Orientation :", "pointy": "Pointy (Pointes en haut)", "flat": "Flat (Plat en haut)", 
        "colors": "🎨 Couleurs dominantes :", "bg_color": "⬛ Fond :", "border_color": "🟫 Bordure :",
        "exclude_bg": "✂️ Transparence du fond :", "exclude_no": "Non (Générer motifs)", "exclude_yes": "Oui (Ignorer le fond)", 
        "generate_btn": "⚡ Générer le Plan", "loading": "Analyse et génération... ☕", "placeholder": "Le SVG s'affichera ici...", "download": "⬇️ Télécharger le SVG"
      },
      "en": {
        "title": "Kumiko Generator", "lang_select": "🌍 Language :", "select_image": "📸 Select image:",
        "width": "↔️ Width (Cols):", "height": "↕️ Height (Rows):", "force_crop": "✂️ Force grid size (Auto-crop)",
        "orientation": "📐 Orientation:", "pointy": "Pointy", "flat": "Flat", 
        "colors": "🎨 Prominent colors:", "bg_color": "⬛ Background:", "border_color": "🟫 Border:",
        "exclude_bg": "✂️ Background Transparency:", "exclude_no": "No (Solid)", "exclude_yes": "Yes (Ignore bg)", 
        "generate_btn": "⚡ Generate Blueprint", "loading": "Generating... ☕", "placeholder": "SVG will appear here...", "download": "⬇️ Download SVG"
      },
      "de": {
        "title": "Kumiko Generator", "lang_select": "🌍 Sprache :", "select_image": "📸 Bild auswählen:",
        "width": "↔️ Breite (Spalten):", "height": "↕️ Höhe (Zeilen):", "force_crop": "✂️ Raster erzwingen (Auto-Zuschnitt)",
        "orientation": "📐 Ausrichtung:", "pointy": "Spitz", "flat": "Flach", 
        "colors": "🎨 Dominante Farben:", "bg_color": "⬛ Hintergrund:", "border_color": "🟫 Rahmen:",
        "exclude_bg": "✂️ Hintergrund-Transparenz:", "exclude_no": "Nein", "exclude_yes": "Ja", 
        "generate_btn": "⚡ Bauplan generieren", "loading": "Generieren... ☕", "placeholder": "SVG wird hier angezeigt...", "download": "⬇️ SVG Herunterladen"
      }
    };

    const langSwitch = document.getElementById('lang-switch');
    langSwitch.addEventListener('change', (e) => {
        const lang = e.target.value;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(translations[lang] && translations[lang][key]) el.innerText = translations[lang][key];
        });
    });

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const dropText = document.getElementById('drop-text');

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; dropText.innerHTML = `📁 ${e.dataTransfer.files[0].name}`; }};
    fileInput.onchange = () => { if (fileInput.files.length) dropText.innerHTML = `📁 ${fileInput.files[0].name}`; };

    const form = document.getElementById('kumiko-form');
    form.onsubmit = async (e) => {
        e.preventDefault();
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const res = await fetch('/generate', { method: 'POST', body: new FormData(form) });
            const data = await res.json();
            if (data.success) {
                document.getElementById('placeholder-text').style.display = 'none';
                const svgImg = document.getElementById('svg-preview');
                svgImg.src = data.file_url + "?t=" + new Date().getTime();
                svgImg.style.display = 'block';
                const dl = document.getElementById('download-btn');
                dl.href = data.file_url;
                dl.style.display = 'inline-block';
            } else alert("Erreur de génération.");
        } catch (err) { alert("Erreur serveur."); }
        document.getElementById('loading-overlay').style.display = 'none';
    };
</script>
</body>
</html>
